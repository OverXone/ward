# Builds and signs Ward.exe when a version tag is pushed, and attaches it to a draft release.
#
#   1. Bump "version" in package.json (and connector/web package.json), commit.
#   2. git tag v0.4.0 && git push origin main v0.4.0
#   3. On GitHub, open the draft release, write the notes, Publish.
#
# Installed copies of Ward see a release only once it's published (they look at "latest").
# Needs the repository secret WARD_UPDATE_KEY: the PEM text of the release signing key.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build:exe

      - name: Sign for the updater
        run: npm run sign:exe
        env:
          WARD_UPDATE_KEY: ${{ secrets.WARD_UPDATE_KEY }}

      - name: Attach to the release (a draft, unless it already exists)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Ward.exe dist/ward-update.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Ward.exe dist/ward-update.json \
              --draft --title "Ward $version" --notes ""
          fi
